<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6a2fc0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Precios TOGO">
<title>Precios a cargar · TOGO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Lista corta para cargar precios de elaborados en el sistema y la balanza: código grande, costo sin IVA y precio con IVA. */
:root{
  --bg:#f6f4fa; --surface:#ffffff; --surface2:#ece8f4; --line:#d9d2e8;
  --fg:#1f1830; --muted:#625a78; --accent:#6a2fc0; --accent-fg:#ffffff; --ok:#17784b; --ok-soft:#dcf1e6; --bad:#b3261e; --bad-soft:#fadcd9;
  --disp:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15101f; --surface:#1e1830; --surface2:#2a2142; --line:#3b3059; --fg:#eee9f8; --muted:#a99fc2; --accent:#b392f0; --accent-fg:#1a0f33; --ok:#5fcf9a; --ok-soft:#14382a; --bad:#ff8d83; --bad-soft:#40201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15101f; --surface:#1e1830; --surface2:#2a2142; --line:#3b3059; --fg:#eee9f8; --muted:#a99fc2; --accent:#b392f0; --accent-fg:#1a0f33; --ok:#5fcf9a; --ok-soft:#14382a; --bad:#ff8d83; --bad-soft:#40201e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;margin:0}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:600 28px/1 var(--disp);text-transform:uppercase;margin:0}
h1 small{display:block;font:500 13px var(--body);letter-spacing:.06em;color:var(--muted);margin-top:6px;text-transform:none}
h2{font:600 18px var(--disp);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 0}
.card{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-variant-numeric:tabular-nums}
.cod{font:700 30px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.prod{font:600 17px var(--disp)}
.mut{color:var(--muted);font-size:14px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1}
.nums div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.nums small{display:block;font:600 12px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nums b{font:700 26px var(--disp)}
.btn{grid-column:1/-1;font:600 16px var(--disp);letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);padding:12px 18px;min-height:48px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.msg{padding:10px 12px;border-radius:8px}.msg.bad{background:var(--bad-soft);color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Precios a cargar<small>Elaborados TOGO: cargá en el sistema el costo sin IVA y el precio con IVA, y el precio en la balanza. Después tocá “Cargado”.</small></h1>
  <div class="msg bad" id="err" hidden></div>
  <div id="lista"><div class="empty">Cargando…</div></div>
  <h2>Ya cargados</h2>
  <div id="hechos"></div>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const money = v => v == null || isNaN(v) ? '—' : '$' + Number(v).toLocaleString('es-AR', { maximumFractionDigits: 0 });
const m2 = v => v == null || isNaN(v) ? '—' : '$' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const CAN = { min: 'Minorista', may: 'Mayorista', pieza: 'Pieza' };
const ahora = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 16).replace('T', ' ');
const fec = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + ' ' + s.slice(11, 16) : '';
try {
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const F = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const app = A.initializeApp({apiKey:"AIzaSyC5voDKO_imN8QqRRpjMQdwV7QILrJw40g",authDomain:"frioteka-preventista.firebaseapp.com",projectId:"frioteka-preventista",storageBucket:"frioteka-preventista.firebasestorage.app",messagingSenderId:"212598423220",appId:"1:212598423220:web:aee51bc39626b3c08621e1"}, 'precios');
  await (await import('./login.js')).requireLogin(app, { color: '#6a2fc0', titulo: 'Precios a cargar · TOGO' });
  const fs = F.getFirestore(app);
  const quien = window.FRIO_USUARIO || 'empleado';
  F.onSnapshot(F.collection(fs, 'el_precios_pend'), sn => {
    const all = sn.docs.map(d => Object.assign({ _id: d.id }, d.data()));
    const pend = all.filter(p => !p.hecho).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    const L = $('lista'); L.textContent = '';
    if (!pend.length) L.appendChild(el('div', 'empty', 'No hay precios para cargar. Cuando Banchi cambie un precio, aparece acá.'));
    pend.forEach(p => {
      const c = el('div', 'card');
      const izq = el('div'); izq.appendChild(el('div', 'cod', p.codigo)); izq.appendChild(el('div', 'prod', p.producto));
      izq.appendChild(el('div', 'mut', (CAN[p.canal] || '') + (p.balanza ? ' · balanza ' + p.balanza : '') + (p.soloCosto ? ' · solo cambia el costo' : '')));
      c.appendChild(izq);
      c.appendChild(el('div', 'mut', 'pedido ' + fec(p.fecha)));
      const n = el('div', 'nums');
      const a = el('div'); a.appendChild(el('small', null, 'Costo sin IVA')); a.appendChild(el('b', null, m2(p.costoSin))); n.appendChild(a);
      const b = el('div'); b.appendChild(el('small', null, 'Precio con IVA')); b.appendChild(el('b', null, money(p.precioCon)));
      if (p.anterior != null && !p.soloCosto) b.appendChild(el('div', 'mut', 'antes ' + money(p.anterior)));
      n.appendChild(b); c.appendChild(n);
      const bt = el('button', 'btn', 'Cargado en sistema y balanza'); bt.type = 'button';
      bt.onclick = () => { bt.disabled = true; F.updateDoc(F.doc(fs, 'el_precios_pend', p._id), { hecho: ahora(), quien }).catch(e => { bt.disabled = false; $('err').hidden = false; $('err').textContent = 'No se pudo marcar (' + (e && e.code || 'error') + ').'; }); };
      c.appendChild(bt); L.appendChild(c);
    });
    const H = $('hechos'); H.textContent = '';
    const hechos = all.filter(p => p.hecho).sort((a, b) => String(b.hecho).localeCompare(String(a.hecho))).slice(0, 20);
    if (!hechos.length) H.appendChild(el('div', 'mut', 'Todavía nada.'));
    hechos.forEach(p => { const r = el('div', 'row'); r.appendChild(el('span', null, p.codigo + ' · ' + p.producto)); r.appendChild(el('span', 'mut', money(p.precioCon) + ' · ' + fec(p.hecho) + ' · ' + (p.quien || ''))); H.appendChild(r); });
  }, () => { $('err').hidden = false; $('err').textContent = 'No se pudo conectar con los datos. Revisá tu conexión.'; });
} catch (e) { $('err').hidden = false; $('err').textContent = 'No se pudo abrir la página: ' + (e && e.message || e); }
</script>
</body>
</html>
