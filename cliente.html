<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>❄ FRIOTEKA — Hacé tu pedido</title>
<style>
:root{--rojo:#B40000;--bg:#F2F2F2;--card:#fff;--borde:#E0E0E0;--verde:#1B7D33;--txt:#222;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:120px;}

/* HEADER */
.hdr{background:var(--rojo);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:22px;font-weight:900;letter-spacing:.5px;}
.logo-sub{font-size:10px;opacity:.8;letter-spacing:.4px;margin-top:1px;}
.badge-ped{background:#fff;color:var(--rojo);font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;display:none;}
.badge-ped.on{display:block;}

/* ENVÍO GRATIS BANNER */
.banner-envio{background:#1B7D33;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:6px 16px;letter-spacing:.3px;}
.banner-envio span{font-weight:400;opacity:.9;}

/* FAMILIAS */
.fam-wrap{background:#fff;padding:10px 12px 8px;border-bottom:1px solid var(--borde);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.fam-wrap::-webkit-scrollbar{display:none;}
.fam-btn{display:inline-block;padding:7px 14px;margin-right:6px;border-radius:20px;border:1.5px solid var(--borde);background:#fff;font-size:13px;font-weight:600;color:#555;cursor:pointer;white-space:nowrap;transition:all .15s;}
.fam-btn.active{background:var(--rojo);color:#fff;border-color:var(--rojo);}

/* CATALOGO */
.cat-titulo{font-size:11px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:.8px;padding:12px 16px 6px;}
.prod-card{background:#fff;margin:0 12px 8px;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.prod-nombre{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:8px;line-height:1.3;}

/* BOTONES PRECIO */
.precio-row{display:flex;gap:8px;align-items:stretch;}
.precio-btn{flex:1;border:none;border-radius:10px;padding:9px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;position:relative;}
.precio-btn .pb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.75;}
.precio-btn .pb-precio{font-size:15px;font-weight:800;}
.precio-btn .pb-detalle{font-size:10px;opacity:.7;}

/* Unitario — azul oscuro */
.btn-unit{background:#EBF2FF;color:#1a3a7c;}
.btn-unit.activo{background:#1a3a7c;color:#fff;}

/* Caja — naranja oscuro — MÁS SEPARADO */
.btn-caja{background:#FFF3E0;color:#7b3a00;}
.btn-caja.activo{background:#E65100;color:#fff;}

.precio-btn .cant-badge{position:absolute;top:-6px;right:-4px;background:#B40000;color:#fff;font-size:11px;font-weight:800;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none;}
.precio-btn .cant-badge.on{display:flex;}

/* CONTROLES CANTIDAD */
.ctrl-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
.ctrl-box{flex:1;display:flex;align-items:center;justify-content:space-between;background:#F5F5F5;border-radius:10px;padding:4px 8px;}
.ctrl-box.oculto{visibility:hidden;}
.ctrl-lbl{font-size:10px;color:#888;font-weight:700;text-align:center;margin-bottom:2px;}
.btn-menos,.btn-mas{background:none;border:none;font-size:20px;color:#555;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.btn-menos:active,.btn-mas:active{background:#e0e0e0;}
.cant-num{font-size:16px;font-weight:800;min-width:24px;text-align:center;}

/* FORMULARIO */
.form-section{background:#fff;margin:12px 12px 0;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.form-titulo{font-size:14px;font-weight:800;color:#333;margin-bottom:14px;}
.form-group{margin-bottom:12px;}
.form-group label{font-size:12px;font-weight:700;color:#666;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
.form-group input{width:100%;padding:11px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none;transition:border .15s;}
.form-group input:focus{border-color:var(--rojo);}
.fpago-row{display:flex;gap:8px;}
.fpago-btn{flex:1;padding:11px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:14px;font-weight:700;color:#555;cursor:pointer;transition:all .15s;text-align:center;}
.fpago-btn.sel{background:var(--rojo);color:#fff;border-color:var(--rojo);}

/* BARRA INFERIOR */
.barra-inf{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px 16px;z-index:20;box-shadow:0 -2px 10px rgba(0,0,0,.1);}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.total-lbl{font-size:13px;color:#888;font-weight:600;}
.total-num{font-size:20px;font-weight:900;color:var(--rojo);}
.envio-lbl{font-size:11px;color:var(--verde);font-weight:700;}
.btns-inf{display:flex;gap:8px;}
.btn-limpiar{flex:0 0 auto;padding:13px 16px;border:1.5px solid #ddd;border-radius:12px;background:#fff;font-size:13px;font-weight:700;color:#888;cursor:pointer;}
.btn-enviar{flex:1;padding:13px;border:none;border-radius:12px;background:#25D366;color:#fff;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-enviar:disabled{background:#ccc;cursor:default;}
</style>
</head>

var ped = {}; // {codigo: {cantU, cantC}} cantU=unidades sueltas, cantC=cajas
var fpago = "";

var CATS_ORDER = [
  "FRUTAS Y VERDURAS","FRUTAS Y VERDURAS AL POR MAYOR","HAMBURGUESAS Y MEDALLONES",
  "MILANESAS Y REBOZADOS","EMPANADAS","PIZZAS","TARTAS Y TORTILLAS","PASTAS",
  "COMIDAS LISTAS","PESCADOS","CARNES","PAPAS","FINGER FOOD","PANIFICACION",
  "HELADOS Y POSTRES","SALUDABLES","SIN GLUTEN"
];

var CAT_EMOJI = {
  "FRUTAS Y VERDURAS":"🥦","FRUTAS Y VERDURAS AL POR MAYOR":"🥦📦",
  "HAMBURGUESAS Y MEDALLONES":"🍔","MILANESAS Y REBOZADOS":"🍽️",
  "EMPANADAS":"🥟","PIZZAS":"🍕","TARTAS Y TORTILLAS":"🥧",
  "PASTAS":"🍝","COMIDAS LISTAS":"🍱","PESCADOS":"🐟","CARNES":"🥩",
  "PAPAS":"🍟","FINGER FOOD":"🧆","PANIFICACION":"🥖",
  "HELADOS Y POSTRES":"🍦","SALUDABLES":"🥗","SIN GLUTEN":"🌾"
};

function fmt(n){return "$"+Math.round(n).toLocaleString("es-AR");}

function buildCats(){
  var cats={};
  P.forEach(function(p){
    var c=p.categoria||"GENERAL";
    if(!cats[c]) cats[c]=[];
    cats[c].push(p);
  });
  return cats;
}

var cats = buildCats();
var catKeys = CATS_ORDER.filter(function(c){return cats[c];});
var catExtra = Object.keys(cats).filter(function(c){return catKeys.indexOf(c)===-1;});
catKeys = catKeys.concat(catExtra);

var catActiva = catKeys[0];

function renderFamilias(){
  var w=document.getElementById("famWrap");
  w.innerHTML="";
  catKeys.forEach(function(c){
    var b=document.createElement("button");
    b.className="fam-btn"+(c===catActiva?" active":"");
    b.textContent=(CAT_EMOJI[c]||"📦")+" "+c.split(" ").slice(0,3).join(" ");
    b.onclick=function(){catActiva=c;renderFamilias();renderCatalogo();};
    w.appendChild(b);
  });
}

function renderCatalogo(){
  var el=document.getElementById("catalogo");
  el.innerHTML="";
  var prods=cats[catActiva]||[];
  var sec=document.createElement("div");
  sec.innerHTML='<div class="cat-titulo">'+(CAT_EMOJI[catActiva]||"")+" "+catActiva+'</div>';
  prods.forEach(function(p){
    var e=ped[p.codigo]||{cantU:0,cantC:0};
    var esK=(p.unidad==="K");
    var unidLbl=esK?"kg":"c/u";
    var cajasLbl=esK?(p.unidadesCaja)+"kg":"x"+p.unidadesCaja+"u";
    var pCaja=p.precioMinorista*p.unidadesCaja;

    var card=document.createElement("div");
    card.className="prod-card";
    card.id="card-"+p.codigo;
    card.innerHTML=
      '<div class="prod-nombre">'+p.nombre+'</div>'+
      '<div class="precio-row">'+
        '<button class="precio-btn btn-unit'+(e.cantU>0?" activo":"")+'\" id="btu-'+p.codigo+'" onclick="toggleUnit('+p.codigo+')">'+
          '<span class="cant-badge'+(e.cantU>0?" on":"")+'" id="badu-'+p.codigo+'">'+e.cantU+'</span>'+
          '<span class="pb-label">Unitario</span>'+
          '<span class="pb-precio">'+fmt(p.precioMinorista)+'</span>'+
          '<span class="pb-detalle">'+unidLbl+'</span>'+
        '</button>'+
        '<button class="precio-btn btn-caja'+(e.cantC>0?" activo":"")+'\" id="btc-'+p.codigo+'" onclick="toggleCaja('+p.codigo+')">'+
          '<span class="cant-badge'+(e.cantC>0?" on":"")+'" id="badc-'+p.codigo+'">'+e.cantC+'</span>'+
          '<span class="pb-label">Caja cerrada</span>'+
          '<span class="pb-precio">'+fmt(pCaja)+'</span>'+
          '<span class="pb-detalle">'+cajasLbl+'</span>'+
        '</button>'+
      '</div>'+
      '<div class="ctrl-row">'+
        '<div class="ctrl-box'+(e.cantU===0?" oculto":"")+'" id="ctru-'+p.codigo+'">'+
          '<div class="ctrl-lbl">Unidades</div>'+
          '<div style="display:flex;align-items:center;gap:4px;">'+
            '<button class="btn-menos" onclick="cambiarCant('+p.codigo+',-1,\'U\')">−</button>'+
            '<span class="cant-num" id="cnu-'+p.codigo+'">'+e.cantU+'</span>'+
            '<button class="btn-mas" onclick="cambiarCant('+p.codigo+',1,\'U\')">+</button>'+
          '</div>'+
        '</div>'+
        '<div class="ctrl-box'+(e.cantC===0?" oculto":"")+'" id="ctrc-'+p.codigo+'">'+
          '<div class="ctrl-lbl">Cajas</div>'+
          '<div style="display:flex;align-items:center;gap:4px;">'+
            '<button class="btn-menos" onclick="cambiarCant('+p.codigo+',-1,\'C\')">−</button>'+
            '<span class="cant-num" id="cnc-'+p.codigo+'">'+e.cantC+'</span>'+
            '<button class="btn-mas" onclick="cambiarCant('+p.codigo+',1,\'C\')">+</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    sec.appendChild(card);
  });
  el.appendChild(sec);
  // scroll top del catálogo
  window.scrollTo({top:document.getElementById("famWrap").offsetTop-60,behavior:"smooth"});
}

function getProd(cod){
  return P.find(function(p){return p.codigo===cod;});
}

function toggleUnit(cod){
  if(!ped[cod]) ped[cod]={cantU:0,cantC:0};
  if(ped[cod].cantU===0){ ped[cod].cantU=1; } else { ped[cod].cantU=0; }
  updateCard(cod);
  updTotal();
}

function toggleCaja(cod){
  if(!ped[cod]) ped[cod]={cantU:0,cantC:0};
  if(ped[cod].cantC===0){ ped[cod].cantC=1; } else { ped[cod].cantC=0; }
  updateCard(cod);
  updTotal();
}

function cambiarCant(cod,delta,tipo){
  if(!ped[cod]) ped[cod]={cantU:0,cantC:0};
  if(tipo==="U"){
    ped[cod].cantU=Math.max(0,ped[cod].cantU+delta);
  } else {
    ped[cod].cantC=Math.max(0,ped[cod].cantC+delta);
  }
  updateCard(cod);
  updTotal();
}

function updateCard(cod){
  var e=ped[cod]||{cantU:0,cantC:0};
  var btu=document.getElementById("btu-"+cod);
  var btc=document.getElementById("btc-"+cod);
  var badu=document.getElementById("badu-"+cod);
  var badc=document.getElementById("badc-"+cod);
  var ctru=document.getElementById("ctru-"+cod);
  var ctrc=document.getElementById("ctrc-"+cod);
  var cnu=document.getElementById("cnu-"+cod);
  var cnc=document.getElementById("cnc-"+cod);
  if(!btu) return;
  btu.className="precio-btn btn-unit"+(e.cantU>0?" activo":"");
  btc.className="precio-btn btn-caja"+(e.cantC>0?" activo":"");
  badu.textContent=e.cantU; badu.className="cant-badge"+(e.cantU>0?" on":"");
  badc.textContent=e.cantC; badc.className="cant-badge"+(e.cantC>0?" on":"");
  ctru.className="ctrl-box"+(e.cantU===0?" oculto":"");
  ctrc.className="ctrl-box"+(e.cantC===0?" oculto":"");
  if(cnu) cnu.textContent=e.cantU;
  if(cnc) cnc.textContent=e.cantC;
}

function calcTotal(){
  var t=0,items=0;
  P.forEach(function(p){
    var e=ped[p.codigo];
    if(!e) return;
    if(e.cantU>0){ t+=p.precioMinorista*e.cantU; items+=e.cantU; }
    if(e.cantC>0){ t+=p.precioMinorista*p.unidadesCaja*e.cantC; items+=e.cantC; }
  });
  return {t:t,items:items};
}

function selFpago(v){
  fpago=v;
  document.getElementById("fpEfectivo").className="fpago-btn"+(v==="efectivo"?" sel":"");
  document.getElementById("fpTransf").className="fpago-btn"+(v==="transferencia"?" sel":"");
  updTotal();
}

function updTotal(){
  var r=calcTotal();
  document.getElementById("totalNum").textContent=fmt(r.t);
  var envioEl=document.getElementById("envioLbl");
  envioEl.style.display=r.t>=60000?"block":"none";
  var badge=document.getElementById("badgePed");
  badge.textContent=r.items+" item"+(r.items!==1?"s":"");
  badge.className="badge-ped"+(r.items>0?" on":"");
  var nombre=document.getElementById("inpNombre").value.trim();
  var dir=document.getElementById("inpDir").value.trim();
  var ok=r.t>0 && nombre && dir && fpago;
  document.getElementById("btnEnviar").disabled=!ok;
}

function limpiarPedido(){
  ped={};
  P.forEach(function(p){ updateCard(p.codigo); });
  updTotal();
}

function buildMsg(){
  var nombre=document.getElementById("inpNombre").value.trim();
  var dir=document.getElementById("inpDir").value.trim();
  var r=calcTotal();
  var m="❄️ *PEDIDO FRIOTEKA*\n";
  m+="📋 "+nombre+"\n";
  m+="📍 "+dir+"\n";
  m+="💳 "+fpago.charAt(0).toUpperCase()+fpago.slice(1)+"\n\n";
  P.forEach(function(p){
    var e=ped[p.codigo];
    if(!e) return;
    var esK=(p.unidad==="K");
    var unidLbl=esK?"kg":"u";
    if(e.cantU>0){
      m+="• "+p.nombre+" x"+e.cantU+unidLbl+" = "+fmt(p.precioMinorista*e.cantU)+"\n";
    }
    if(e.cantC>0){
      var pCaja=p.precioMinorista*p.unidadesCaja;
      m+="• "+p.nombre+" x"+e.cantC+" caja"+(e.cantC>1?"s":"")+" ("+p.unidadesCaja+unidLbl+"/caja) = "+fmt(pCaja*e.cantC)+"\n";
    }
  });
  m+="\n💰 *TOTAL: "+fmt(r.t)+"*";
  if(r.t>=60000) m+="\n🚚 Envío gratis";
  return m;
}

function enviarWA(){
  var msg=buildMsg();
  var url="https://wa.me/?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
  limpiarPedido();
  document.getElementById("inpNombre").value="";
  document.getElementById("inpDir").value="";
  fpago="";
  document.getElementById("fpEfectivo").className="fpago-btn";
  document.getElementById("fpTransf").className="fpago-btn";
  updTotal();
}

// Init
renderFamilias();
renderCatalogo();
updTotal();
</script>

</html>
