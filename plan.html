<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd21f">
<title>Plan Banchi y Fernanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para celular; banda amarilla arriba con calorías y proteína, pestañas fijas abajo */
:root{
  --bg:#fffbe6; --surface:#ffffff; --ink:#1d1a0e; --muted:#6b6447; --line:#ece3b8;
  --yellow:#ffd21f; --yellow-ink:#1d1a0e; --yellow-soft:#fff1a8;
  --meat:#b0303a; --meat-soft:#f8dfe1; --ok:#56632a; --ok-soft:#e4e9c9; --over:#c0392b;
  --moss:#56632a; --moss-ink:#f7f4dc; --moss-soft:#e4e9c9; --red:#9e2b25; --red-ink:#fff3ec; --red-soft:#f6ddd8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16150d; --surface:#211f14; --ink:#f4efd6; --muted:#b3ab86; --line:#38351f;
  --yellow:#ffd21f; --yellow-ink:#1d1a0e; --yellow-soft:#3a3412;
  --meat:#f08a90; --meat-soft:#3f2224; --ok:#a9bb5c; --ok-soft:#2a3018; --over:#ff7a6b; --moss:#56632a; --moss-ink:#f7f4dc; --moss-soft:#2a3018; --red:#9e2b25; --red-ink:#fff3ec; --red-soft:#3d201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16150d; --surface:#211f14; --ink:#f4efd6; --muted:#b3ab86; --line:#38351f;
  --yellow:#ffd21f; --yellow-ink:#1d1a0e; --yellow-soft:#3a3412;
  --meat:#f08a90; --meat-soft:#3f2224; --ok:#a9bb5c; --ok-soft:#2a3018; --over:#ff7a6b; --moss:#56632a; --moss-ink:#f7f4dc; --moss-soft:#2a3018; --red:#9e2b25; --red-ink:#fff3ec; --red-soft:#3d201d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.band{background:var(--yellow);color:var(--yellow-ink);transition:background .25s}
.band.musgo{background:var(--moss);color:var(--moss-ink)}
.band.rojo{background:var(--red);color:var(--red-ink)}
.band.musgo .who,.band.rojo .who{background:rgba(255,255,255,.16)}
.band.musgo .who button,.band.rojo .who button{color:inherit}
.band.musgo .who button[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.band.rojo .who button[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.gauge{color:var(--yellow-ink)}
.savestate{font-size:.75rem;font-weight:600;opacity:.8}
.gbar i.prot{background:var(--moss)}
.in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .in{padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.75}
.who{display:flex;background:rgba(29,26,14,.1);border-radius:999px;padding:3px}
.who button{border:0;background:none;color:var(--yellow-ink);font:700 .85rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--yellow-ink);color:var(--yellow)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gauge{background:rgba(255,255,255,.55);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.gauge .v{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1}
.gauge .s{font-size:.8rem;font-weight:600}
.gbar{height:8px;background:rgba(29,26,14,.15);border-radius:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--yellow-ink);border-radius:4px}
.gbar i.over{background:#c0392b}
main.in{padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:10px}
.sub{color:var(--muted);font-size:.85rem}
button{font-family:var(--f-body)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;font:600 .88rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--yellow-ink);background:var(--yellow);color:var(--yellow-ink)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.meal input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:#c9a400;cursor:pointer}
.k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.t{font-weight:600}
.mac{font-variant-numeric:tabular-nums;font-size:.82rem;text-align:right;white-space:nowrap;line-height:1.3}
.mac b{font-size:.95rem}
.por{grid-column:2/4;font-size:.82rem;color:var(--muted)}
.acts{grid-column:2/4;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.link{border:0;background:none;color:var(--ink);font:700 .82rem var(--f-body);padding:4px 0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:3px;text-underline-offset:3px}
.meal.done .t{text-decoration:line-through;opacity:.6}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.red{background:var(--meat-soft);color:var(--meat)}
.tag.har{background:var(--moss-soft);color:var(--moss)}
.tag.fav{background:var(--yellow);color:var(--yellow-ink)}
.picker{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.opt .pick{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:500 .88rem var(--f-body)}
.opt .pick small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.ico{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1rem}
.ico[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow-ink);color:var(--yellow-ink)}
.note{background:var(--yellow-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.note b{display:block;margin-bottom:2px}
.note.ok{background:var(--ok-soft)}
.counter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.counter .ico{width:40px;height:40px;font-size:1.3rem}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glasses span{width:14px;height:22px;border:1.5px solid var(--ink);border-radius:2px 2px 5px 5px}
.glasses span.f{background:var(--yellow)}
.days,.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button,.weeks button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font:600 .85rem var(--f-body);cursor:pointer}
.days button[aria-pressed="true"],.weeks button[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow-ink)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list input{width:20px;height:20px;accent-color:#c9a400;flex:0 0 auto;margin-top:1px}
ul.list .q{margin-left:auto;color:var(--muted);font-size:.85rem;text-align:right;flex:0 0 auto}
ul.list li.got label{text-decoration:line-through;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
input[type=number],input[type=date],input[type=text],select{font:500 .95rem var(--f-body);padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0;box-sizing:border-box}
.btn{border:0;background:var(--yellow);color:var(--yellow-ink);font:700 .9rem var(--f-body);padding:11px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.75rem;color:var(--muted)}
.p-prog .stat{border-left:4px solid var(--moss)}
.p-prog .btn{background:var(--moss);color:var(--moss-ink)}
.p-datos .btn{background:var(--red);color:var(--red-ink)}
.ficha{background:var(--red-soft);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-variant-numeric:tabular-nums}
.ficha .v{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--red)}
.ficha .l{font-size:.75rem;color:var(--muted)}
.ficha .big{grid-column:1/-1;border-bottom:1px solid rgba(158,43,37,.25);padding-bottom:8px}
.ficha .big .v{font-size:2.4rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ficha .v{color:#f0a49c}}
:root[data-theme="dark"] .ficha .v{color:#f0a49c}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem}
.chart svg{width:100%;height:auto;display:block}
.extra{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid var(--line)}
.extra button{border:0;background:none;color:var(--muted);cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .row{display:flex;max-width:640px;margin:0 auto}
nav.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:600 .7rem var(--f-body);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px;padding:2px;border-radius:8px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{background:var(--yellow);color:var(--yellow-ink)}
.status{font-size:.75rem;color:var(--muted)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
@media (max-width:380px){.gauges{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
.band{padding-top:env(safe-area-inset-top,0px)}
.cfg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cfg code{background:var(--yellow-soft);padding:1px 5px;border-radius:4px}
</style>
</head>

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return key(x)}
function parse(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)}

function PD(p){p=p||S.persona;const g=S.gente[p]||(S.gente[p]={});g.dias=g.dias||{};g.pesos=g.pesos||[];g.datos=Object.assign({},DATOS0[p],g.datos||{});return g}
function dia(k,p){const g=PD(p).dias;const D=g[k]||(g[k]={});D.comidas=D.comidas||{};D.act=D.act||{};D.cambios=D.cambios||{};D.extras=D.extras||[];D.agua=D.agua||0;return D}

function catalog(){
  const m={};
  BASE.forEach(([id,slot,n,b,f,tg])=>m[id]={id,slot,n,b:{p:b[0],k:b[1],por:b[2]},f:{p:f[0],k:f[1],por:f[2]},tg});
  (S.custom||[]).forEach(c=>m[c.id]={id:c.id,slot:c.slot,n:c.n,tg:c.roja?"r":"",custom:1,b:{p:c.p,k:c.k,por:"Porción de Banchi"},f:{p:Math.round(c.p*.75),k:Math.round(c.k*.75),por:"75 % de la porción de Banchi"}});
  return m;
}
function mac(m,p){return m[(p||S.persona)==="banchi"?"b":"f"]}
function optionsFor(slot){return Object.values(catalog()).filter(m=>m.slot===slot&&!S.nogusta[m.id]).sort((x,y)=>(S.favs[y.id]?1:0)-(S.favs[x.id]?1:0))}
function baseId(w,i,slot){if(slot==="d")return DES[i];if(slot==="m")return "m1";return SEM[w][slot][i]}
function resolve(w,i,slot,D){
  const C=catalog();
  let id=(D&&D.cambios&&D.cambios[slot])||S.planMod[w+"-"+i+"-"+slot]||baseId(w,i,slot);
  if(!C[id]||S.nogusta[id]){const o=optionsFor(slot);id=o.length?o[0].id:baseId(w,i,slot)}
  return C[id]||C[baseId(w,i,slot)];
}
function dayTotals(dt,p){
  p=p||S.persona;const D=peek(key(dt),p)||{comidas:{},cambios:{},extras:[]},w=semanaDe(dt),i=idx(dt);
  let kc=0,pr=0;
  ["d","a","m","c"].forEach(s=>{if(D.comidas&&D.comidas[s]){const m=mac(resolve(w,i,s,D),p);kc+=m.k;pr+=m.p}});
  (D.extras||[]).forEach(x=>{kc+=x.k||0;pr+=x.p||0});
  return {kc,pr,D};
}

// ---------- energía ----------
function pesoActual(p){const g=PD(p);const ps=[...g.pesos].sort((a,b)=>a.f.localeCompare(b.f));return ps.length?ps[ps.length-1].p:Number(g.datos.peso)||0}
function gasto(p,dt){
  p=p||S.persona;const d=PD(p).datos,w=pesoActual(p),h=Number(d.altura),a=Number(d.edad);
  if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a+(d.sexo==="h"?5:-161);
  let act=0;if(dt){const D=peek(key(dt),p);ACT[idx(dt)].forEach(x=>act+=(D&&D.act&&D.act[x]?ACT_KCAL[x]:0))}
  return {bmr:Math.round(bmr),tot:Math.round(bmr*1.3+act),prom:Math.round(bmr*1.3+(350*3+400+250*3)/7)};
}
function metaK(p){
  p=p||S.persona;const g=gasto(p);if(!g)return null;const d=PD(p).datos;
  const def=Math.round((Number(d.ritmo)||0.5)*7700/7),piso=d.sexo==="h"?1500:1200;
  return {meta:Math.max(piso,g.prom-def),def,g};
}

function chart(ps){

   <polygon points="${x(0)},${H-B} ${pts} ${x(ps.length-1)},${H-B}" fill="var(--moss-soft)"/>
   <polyline points="${pts}" fill="none" stroke="var(--moss)" stroke-width="2.5"/>
   <circle cx="${x(ps.length-1)}" cy="${y(v[v.length-1])}" r="6" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2"/>
   <text x="${x(0)}" y="${H-8}" font-size="11" fill="var(--muted)">${ps[0].f.slice(8)}/${ps[0].f.slice(5,7)}</text>
   <text x="${W-R}" y="${H-8}" font-size="11" text-anchor="end" fill="var(--muted)">${ps[ps.length-1].f.slice(8)}/${ps[ps.length-1].f.slice(5,7)}</text></svg>`;
}
function vDatos(){
  const p=S.persona,d=PD().datos,mk=metaK(),pa=pesoActual();setHdr("Lo fijo de cada uno","Datos de "+NOMBRE[p]);
  const ficha=mk?`<div class="ficha"><div class="big"><div class="v">${mk.meta} kcal</div><div class="l">para comer por día y bajar ${String(d.ritmo).replace(".",",")} kg por semana</div></div>
   <div><div class="v">${mk.g.prom}</div><div class="l">kcal que gastás por día</div></div><div><div class="v">${mk.def}</div><div class="l">kcal de déficit diario</div></div><div><div class="v">${metaP()} g</div><div class="l">de proteína</div></div></div>`
   :`<div class="ficha"><div class="big"><div class="v">Faltan datos</div><div class="l">${pa?"Completá edad y altura":"Completá edad y altura, y cargá tu peso en Progreso"} para calcular cuántas calorías comer.</div></div></div>`;
  return `<div class="p-datos" style="display:flex;flex-direction:column;gap:18px">${ficha}
  <section><h2>Tus datos</h2><form class="form" id="fDatos">
   <label>Sexo<select id="dS"><option value="h" ${d.sexo==="h"?"selected":""}>Hombre</option><option value="m" ${d.sexo==="m"?"selected":""}>Mujer</option></select></label>
   <label>Edad<input type="number" id="dE" min="15" max="100" value="${esc(d.edad)}"></label>
   <label class="full">Altura (cm)<input type="number" id="dA" min="120" max="230" value="${esc(d.altura)}"></label>
   <label class="full">Ritmo para bajar<select id="dR">${[[0.5,"0,5 kg por semana (más llevadero)"],[0.75,"0,75 kg por semana"],[1,"1 kg por semana (más exigente)"]].map(([v,t])=>`<option value="${v}" ${Number(d.ritmo)===v?"selected":""}>${t}</option>`).join("")}</select></label>
   <label class="full">Meta de proteína (g por día)<input type="number" id="dM" min="50" max="300" value="${metaP()}"></label>
   <button class="btn full" type="submit">Guardar datos</button></form>
   <div class="sub">${pa?`Peso usado para el cálculo: ${pa} kg (el último cargado en Progreso).`:`El peso se carga en Progreso.`}</div></section>
  <section><h2>Inicio del plan</h2><div class="form"><label class="full">Lunes de la semana 1<input type="date" id="aIni" value="${S.inicio}"></label></div></section>
  <section><h2>Pautas</h2><ul class="rules">
   <li>Proteína en todas las comidas: cuida el músculo mientras bajás.</li>
   <li>La noche es el momento de riesgo: cena con mucha proteína y verdura, y después solo té.</li>
   <li>Sin lactosa: yogur y leche deslactosados. Revisá etiquetas de fiambres.</li>
   <li>Grasas: 1 cda de aceite de oliva por comida y ½ palta en el desayuno.</li>
   <li>Mate, té y café sin azúcar. Alcohol: evitarlo al principio.</li>
   <li>Si te marea entrenar en ayunas, sumá una fruta antes.</li>
   <li>Dormir 7-8 horas ayuda a no tener hambre a la noche.</li></ul>
   <button class="btn ghost" data-recfg type="button">Cambiar token o repo</button>
   <div class="sub">El gasto se calcula con la fórmula Mifflin-St Jeor y actividad diaria liviana, más el gym (unas 350 kcal), el pádel (400) y la caminata (250), repartidos en la semana.</div></section>
</div>`;
}
function setHdr(e,t){document.getElementById("hdrEyebrow").textContent=e;document.getElementById("hdrTitle").textContent=t}
function render(){
  document.getElementById("whoB").setAttribute("aria-pressed",S.persona==="banchi");
  document.getElementById("whoF").setAttribute("aria-pressed",S.persona==="fernanda");
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  document.getElementById("band").className="band "+({progreso:"musgo",datos:"rojo"}[tab]||"");
  document.getElementById("view").innerHTML=({hoy:vHoy,semana:vSemana,comidas:vComidas,compras:vCompras,progreso:vProgreso,datos:vDatos})[tab]();
  gauges();
}

// ---------- eventos ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.type==="submit"&&b.closest("form"))return;const D=dia(key(new Date()));
  if(b.dataset.tab){tab=b.dataset.tab;picker=null;scrollTo(0,0);render();return}
  if(b.id==="whoB"||b.id==="whoF"){S.persona=b.id==="whoB"?"banchi":"fernanda";try{localStorage.setItem("plan-quien",S.persona)}catch(e){}render();return}
  if(b.dataset.act){D.act[b.dataset.act]=!D.act[b.dataset.act]}
  else if(b.dataset.agua){D.agua=Math.max(0,Math.min(12,D.agua+Number(b.dataset.agua)))}
  else if(b.hasAttribute("data-mate")){D.mate=!D.mate}
  else if(b.hasAttribute("data-te")){D.te=!D.te}
  else if(b.dataset.sem){verSem=Number(b.dataset.sem);picker=null;render();return}
  else if(b.dataset.dia){verDia=Number(b.dataset.dia);picker=null;render();return}
  else if(b.dataset.open){const o={slot:b.dataset.open,ctx:b.dataset.ctx};picker=picker&&picker.slot===o.slot&&picker.ctx===o.ctx?null:o;render();return}
  else if(b.hasAttribute("data-close")){picker=null;render();return}
  else if(b.dataset.pick){applyPick(b.dataset.ctx,b.dataset.pick)}
  else if(b.dataset.fav){if(S.favs[b.dataset.fav])delete S.favs[b.dataset.fav];else S.favs[b.dataset.fav]=true}
  else if(b.dataset.no){const id=b.dataset.no;if(S.nogusta[id])delete S.nogusta[id];else{S.nogusta[id]=true;delete S.favs[id]}}
  else if(b.dataset.delc){S.custom=S.custom.filter(c=>c.id!==b.dataset.delc)}
  else if(b.dataset.delx){D.extras.splice(Number(b.dataset.delx),1)}
  else if(b.hasAttribute("data-recfg")){pantallaConfig();return}
  else if(b.hasAttribute("data-reset")){S.compras={}}
  else if(b.dataset.del){PD().pesos=PD().pesos.filter(r=>r.f!==b.dataset.del)}
  else return;
  save();render();
});
function applyPick(ctx,id){
  const slot=picker.slot;
  if(ctx==="hoy")dia(key(new Date())).cambios[slot]=id;
  else S.planMod[verSem+"-"+verDia+"-"+slot]=id;
  picker=null;
}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.meal){dia(key(new Date())).comidas[t.dataset.meal]=t.checked}
  else if(t.dataset.buy){S.compras[t.dataset.buy]=t.checked}
  else if(t.id==="aIni"&&t.value){S.inicio=mondayOf(parse(t.value))}
  else return;
  save();render();
});
document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="fPeso"){const fe=document.getElementById("pF").value,p=parseFloat(document.getElementById("pP").value),c=document.getElementById("pC").value;if(!fe||!p)return;const g=PD();g.pesos=g.pesos.filter(r=>r.f!==fe);g.pesos.push({f:fe,p,c:c?Number(c):null});g.datos.peso=p}
  else if(f.id==="fExtra"){dia(key(new Date())).extras.push({n:document.getElementById("xN").value.trim(),k:Number(document.getElementById("xK").value)||0,p:Number(document.getElementById("xP").value)||0})}
  else if(f.id==="fDatos"){const d=PD().datos;d.sexo=document.getElementById("dS").value;d.edad=document.getElementById("dE").value;d.altura=document.getElementById("dA").value;d.ritmo=Number(document.getElementById("dR").value);const m=Number(document.getElementById("dM").value);if(m)S.meta[S.persona]=m;st("Datos guardados")}
  else if(f.classList.contains("newmeal")){const fd=new FormData(f),id="u"+Date.now().toString(36);S.custom=S.custom||[];S.custom.push({id,slot:f.dataset.slot,n:String(fd.get("n")).trim(),p:Number(fd.get("p"))||0,k:Number(fd.get("k"))||0,roja:!!fd.get("r")});S.favs[id]=true;picker={slot:f.dataset.slot,ctx:f.dataset.ctx};applyPick(f.dataset.ctx,id)}
  else return;
  save();render();
});

// ---------- guardado en GitHub (repo privado) ----------
let CFG=null,SHA=null,dirty=false,saving=false,listo=false;
function cfgLoad(){try{CFG=JSON.parse(localStorage.getItem("plan-cfg")||"null")}catch(e){CFG=null}}
function cfgSave(){try{localStorage.setItem("plan-cfg",JSON.stringify(CFG))}catch(e){}}
const apiUrl=()=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
const H=()=>({"Authorization":"Bearer "+CFG.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
async function cargarRemoto(){
  const r=await fetch(apiUrl()+"?t="+Date.now(),{headers:H(),cache:"no-store"});
  if(r.status===404){SHA=null;return null}
  if(!r.ok)throw new Error(r.status===401?"El token no es válido o venció":r.status===403?"El token no tiene permiso sobre ese repo":"GitHub respondió "+r.status);
  const j=await r.json();SHA=j.sha;return JSON.parse(b64d(j.content));
}
async function subir(){
  const data=clone(S);delete data.persona;
  const body={message:"plan: "+NOMBRE[S.persona]+" actualizó",content:b64e(JSON.stringify(data)),sha:SHA||undefined};
  const r=await fetch(apiUrl(),{method:"PUT",headers:H(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error("conflicto");e.conflicto=true;throw e}
  if(!r.ok)throw new Error(r.status===401?"El token no es válido o venció":"GitHub respondió "+r.status);
  SHA=(await r.json()).content.sha;
}
function save(){lsSet();if(!listo)return;dirty=true;st("Guardando…");clearTimeout(saveT);saveT=setTimeout(flush,1200)}
async function flush(){
  if(saving||!dirty)return;saving=true;dirty=false;
  try{await subir();st("Guardado ✓")}
  catch(e){
    if(e.conflicto){try{await cargarRemoto();dirty=true}catch(x){dirty=true}}
    else{dirty=true;st("Sin conexión · se guarda cuando vuelva");setTimeout(flush,15000)}
  }
  saving=false;saveT=null;if(dirty)setTimeout(flush,300);
}
window.addEventListener("beforeunload",e=>{if(dirty||saving){e.preventDefault();e.returnValue=""}});
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!listo||dirty||saving)return;
  try{const d=await cargarRemoto();if(d&&!dirty&&!saving){S=load(d);lsSet();if(!picker)render()}}catch(e){}
});

// ---------- arranque ----------
function clone(o){return JSON.parse(JSON.stringify(o||{}))}
function load(o){const n=Object.assign(blank(),clone(o));["banchi","fernanda"].forEach(p=>{n.gente[p]=n.gente[p]||{}});["favs","nogusta","planMod","compras","meta"].forEach(k=>n[k]=n[k]||{});n.custom=n.custom||[];n.persona=quien();return n}
function quien(){try{return localStorage.getItem("plan-quien")||"banchi"}catch(e){return "banchi"}}
function pantallaConfig(msg){
  document.querySelector("nav.tabs").hidden=true;document.getElementById("gauges").hidden=true;
  setHdr("Se hace una sola vez en cada celular","Conectar");
  const c=CFG||{};
  document.getElementById("view").innerHTML=`<div class="cfg">${msg?`<div class="note"><b>No pude conectar</b>${esc(msg)}</div>`:""}
   <div class="sub">Los datos se guardan en tu repo privado de GitHub, igual que la app de empleados. Usá el mismo token (necesita permiso de lectura y escritura sobre <code>frioteka-privado</code>).</div>
   <form class="form" id="fCfg">
    <label>Usuario de GitHub<input type="text" id="cOwner" value="${esc(c.owner||"EstebanGabriel")}" autocapitalize="off"></label>
    <label>Repo privado<input type="text" id="cRepo" value="${esc(c.repo||"frioteka-privado")}" autocapitalize="off"></label>
    <label class="full">Archivo de datos<input type="text" id="cPath" value="${esc(c.path||"plan-alimentacion.json")}" autocapitalize="off"></label>
    <label class="full">Token de GitHub<input type="password" id="cTok" value="${esc(c.token||"")}" autocapitalize="off" placeholder="github_pat_..."></label>
    <button class="btn full" type="submit">Conectar</button></form></div>`;
}
async function abrir(){
  document.querySelector("nav.tabs").hidden=false;document.getElementById("gauges").hidden=false;
  st("Cargando datos…");
  try{
    const d=await cargarRemoto();
    if(d){S=load(d)}else{const loc=lsGet();S=load(loc||{})}
    lsSet();listo=true;render();
    if(!d){dirty=true;await flush()}else st("Guardado ✓");
  }catch(e){
    const loc=lsGet();
    if(/fetch|network|Failed|Load/i.test(e.message)&&loc){S=load(loc);listo=true;render();st("Sin conexión · datos del celular")}
    else pantallaConfig(e.message);
  }
}
document.addEventListener("submit",e=>{
  if(e.target.id!=="fCfg")return;e.preventDefault();e.stopImmediatePropagation();
  const v=id=>document.getElementById(id).value.trim();
  if(!v("cTok"))return;
  CFG={owner:v("cOwner"),repo:v("cRepo"),path:v("cPath")||"plan-alimentacion.json",token:v("cTok")};cfgSave();abrir();
},true);
cfgLoad();
const loc0=lsGet();if(loc0)S=load(loc0);
if(CFG){render();abrir()}else pantallaConfig();
</script>
