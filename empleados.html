<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Empleados FRIOTEKA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--pri:#b8436f;--pri2:#d9799c;--pri-l:#fbe3ec;--bg:#fdf5f8;--head:#f9d3e1;--headtx:#5e1d39;--card:#fff;--tx:#1e1b24;--mut:#6d6878;--bd:#f0d9e2;--ok:#1d7a46;--ok-l:#e3f4ea;--bad:#b42318;--bad-l:#fdecea;--warn:#9a6700;--warn-l:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--head);color:var(--headtx);border-bottom:1px solid #f1bfd2;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
main{padding:12px 12px 90px;max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 8px;font-size:14px;color:var(--pri)}
.muted{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.row:last-child{border-bottom:0}
.row.tot{font-weight:700;border-top:2px solid var(--tx);border-bottom:0;margin-top:4px;padding-top:8px}
.row.big{font-size:17px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.emp{cursor:pointer}
.emp .nm{font-weight:700;font-size:16px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pri-l);color:var(--pri);font-weight:600}
.tag.warn{background:var(--warn-l);color:var(--warn)} .tag.info{background:#e1e9f7;color:#3d5f99} .tag.mut{background:#f3f1f4;color:var(--mut)} .tag.bad{background:var(--bad-l);color:var(--bad)} .tag.ok{background:var(--ok-l);color:var(--ok)}
.per{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.per b{font-size:15px;text-align:center;flex:1}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri-l);color:var(--pri)} .btn.sm{padding:6px 10px;font-size:13px} .btn.full{width:100%}
.btn.ghost{background:none;color:var(--pri);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--bd)}
td{padding:5px 4px;border-bottom:1px solid #f6e6ec;vertical-align:middle}
td input,td select{width:100%;border:1px solid var(--bd);border-radius:6px;padding:5px;font-size:13px;background:#fff}
td input.h{width:58px;text-align:center}
tr.fer td{background:#fce8f0} tr.off td{color:#aaa}
.scroll{overflow-x:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{font:inherit}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:15px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--pri-l);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--pri);cursor:pointer}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{background:var(--warn-l);color:#5c4300;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.ok-box{background:var(--ok-l);color:#14532d;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
pre.out{white-space:pre-wrap;background:#fffafc;border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:12.5px;max-height:420px;overflow:auto}
#pin{position:fixed;inset:0;background:var(--head);display:flex;align-items:center;justify-content:center;z-index:20}
#pin .box{background:#fff;border-radius:16px;padding:22px;width:330px;max-width:92vw;text-align:center;max-height:92vh;overflow:auto}
#pin .box .f{text-align:left}
#pin input{font-size:26px;letter-spacing:10px;text-align:center;width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.del{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="pin"><div class="box" id="pinBox"></div></div>
<header><h1>Empleados FRIOTEKA</h1><div class="sub" id="hsub"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
let DB=null;
const HOY=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
const EMPS=()=>DB.empleados.map(e=>e.id);
const st={tab:"inicio",emp:"Lorena",per:null,cargar:"adelanto",cierreMes:"2026-10"};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const fmt=n=>{const r=Math.round(Math.abs(n));return(n<0&&r?"-":"")+"$ "+r.toLocaleString("es-AR")};
const fmt2=n=>(n<-0.005?"-":"")+"$ "+Math.abs(n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fh=n=>(Math.round(n*10)/10).toLocaleString("es-AR");
const D=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const lunes=s=>{const d=D(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const dm=s=>{const[y,m,d]=s.split("-");return d+"/"+m};
const dmy=s=>{const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mesTxt=ym=>{const[y,m]=ym.split("-");return MESES[+m-1]+" "+y};
const finMes=ym=>{const[y,m]=ym.split("-").map(Number);return iso(new Date(y,m,0))};
const sumMes=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
/* ---------- guardado en GitHub (repo privado) ---------- */
const LS={get(k){try{return localStorage.getItem("emp_"+k)}catch(e){return null}},set(k,v){try{localStorage.setItem("emp_"+k,v)}catch(e){}},del(k){try{localStorage.removeItem("emp_"+k)}catch(e){}}};
let CFG=null,SHA=null,dirty=false,saving=false,saveT=null,estado="";
function cfgLoad(){try{CFG=JSON.parse(LS.get("cfg")||"null")}catch(e){CFG=null}}
const apiUrl=()=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
const H=()=>({"Authorization":"Bearer "+CFG.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
async function cargarRemoto(){
  const r=await fetch(apiUrl()+"?t="+Date.now(),{headers:H(),cache:"no-store"});
  if(r.status===404)return null;
  if(!r.ok)throw new Error(r.status===401?"El token no es válido o venció":r.status===403?"El token no tiene permiso sobre ese repo":"GitHub respondió "+r.status);
  const j=await r.json();SHA=j.sha;return JSON.parse(b64d(j.content))}
async function subir(msg){
  const body={message:(CFG.quien||"app")+": "+(msg||"actualización"),content:b64e(JSON.stringify(DB)),branch:CFG.branch||undefined};if(SHA)body.sha=SHA;
  const r=await fetch(apiUrl(),{method:"PUT",headers:H(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error("conflicto");e.conflicto=true;throw e}
  if(!r.ok)throw new Error("GitHub respondió "+r.status);
  const j=await r.json();SHA=j.content.sha}
function setEstado(s){estado=s;const e=$("#hsub");if(e)e.textContent=`Hoy ${dmy(HOY)} · ${s}`}
function save(msg){dirty=true;LS.set("cache",JSON.stringify(DB));setEstado("guardando…");clearTimeout(saveT);saveT=setTimeout(()=>flush(msg),1200)}
async function flush(msg){if(saving||!dirty)return;saving=true;dirty=false;
  try{await subir(msg);LS.del("pend");setEstado("guardado ✓")}
  catch(e){
    if(e.conflicto){try{DB=await cargarRemoto();LS.set("cache",JSON.stringify(DB));render();toast("Otra persona guardó cambios. Recargué los datos: revisá y volvé a cargar lo último.");setEstado("actualizado")}catch(x){setEstado("sin conexión")}}
    else{dirty=true;LS.set("pend","1");setEstado("sin conexión · se guarda al volver");setTimeout(()=>flush(msg),15000)}}
  saving=false;if(dirty)flush()}
window.addEventListener("beforeunload",e=>{if(dirty||saving){e.preventDefault();e.returnValue=""}});
const E=id=>DB.empleados.find(e=>e.id===id);

/* ---------- reglas ---------- */
function tarifa(emp,f){let r=null;for(const t of DB.tarifas)if(t.emp===emp&&t.desde<=f&&(!r||t.desde>r.desde))r=t;return r||{hora:0,trasSem:0,trasMes:0,plus:0}}
function regimen(emp,f){let r=null;for(const t of E(emp).regimen)if(t.desde<=f&&(!r||t.desde>r.desde))r=t;return r?r.tipo:"semanal"}
const esFer=f=>DB.feriados.includes(f);
function dia(emp,f){return DB.horas[emp+"|"+f]||{}}
function hsPagas(emp,f,h){
  if(h==null||h==="")return 0;h=+h;if(!esFer(f))return h;
  const e=E(emp);
  if(e.feriado==="blanco"&&regimen(emp,f)==="mensual")return Math.min(h,4)+2*Math.max(0,h-4);
  return 2*h}
const movsDe=emp=>DB.movs.filter(m=>m.emp===emp);
const DEBE=m=>m.tipo!=="descuento";
function saldoCC(emp,hasta){let s=0;for(const m of movsDe(emp))if(!hasta||m.fecha<=hasta)s+=DEBE(m)?m.importe:-m.importe;return s}
function saldoAntes(emp,desde){let s=0;for(const m of movsDe(emp))if(m.fecha<desde)s+=DEBE(m)?m.importe:-m.importe;return s}
const descImp=(emp,imp)=>movsDe(emp).filter(m=>m.tipo==="descuento"&&m.imputa===imp).reduce((a,m)=>a+m.importe,0);
const pagosImp=(emp,imp,tipo)=>DB.pagos.filter(p=>p.emp===emp&&p.imputa===imp&&(!tipo||p.tipo===tipo));

function liqSemana(emp,lun){
  const dias=[];let hp=0,imp=0,ht=0;
  for(let i=0;i<7;i++){const f=addD(lun,i),r=dia(emp,f),p=hsPagas(emp,f,r.h),t=tarifa(emp,f).hora;
    dias.push({f,...r,hp:p,imp:p*t});hp+=p;imp+=p*t;ht+=r.h?+r.h:0}
  const tr=hp>0?tarifa(emp,lun).trasSem:0,bruto=imp+tr,key="S"+lun,desc=descImp(emp,key);
  const pg=pagosImp(emp,key),pagado=pg.filter(p=>!p.sinCaja).reduce((a,p)=>a+p.importe,0),pagar=bruto-desc;
  return{tipo:"semanal",key,dias,ht,hp,imp,valor:tarifa(emp,lun).hora,valor2:tarifa(emp,addD(lun,6)).hora,tr,bruto,desc,pagar,pg,pagado,pend:pagar-pagado}}
function liqMes(emp,ym){
  const e=E(emp),dias=[];let hp=0,ht=0;const fin=finMes(ym);
  for(let f=ym+"-01";f<=fin;f=addD(f,1)){const r=dia(emp,f),p=hsPagas(emp,f,r.h);dias.push({f,...r,hp:p});hp+=p;ht+=r.h?+r.h:0}
  const ov=DB.horasMes[emp+"|"+ym];if(ov!=null)hp=ov;
  const t=tarifa(emp,fin),cub=e.horasRecibo||0,extra=cub?Math.max(0,hp-cub):0,extraP=extra*t.hora;
  const rec=DB.recibos.find(r=>r.emp===emp&&r.mes===ym),neto=rec?rec.neto:null;
  const sueldo=(neto||0)+extraP+t.plus+t.trasMes,ad=pagosImp(emp,ym,"adelanto"),adel=ad.reduce((a,p)=>a+p.importe,0);
  const desc=descImp(emp,ym),saldo=sueldo-adel-desc,pg=pagosImp(emp,ym,"pago"),pagado=pg.reduce((a,p)=>a+p.importe,0);
  return{tipo:"mensual",key:ym,dias,ht,hp,ov:ov!=null,cub,extra,valor:t.hora,extraP,plus:t.plus,tras:t.trasMes,neto,sueldo,ad,adel,desc,saldo,pg,pagado,pend:saldo-pagado}}
function novMes(emp,ym){const c={tarde:0,falta:0,susp:0,min:0};
  for(const k in DB.horas){if(!k.startsWith(emp+"|"+ym))continue;const r=DB.horas[k];
    if(r.nov==="Tarde"){c.tarde++;c.min+=+(r.min||0)} if(r.nov==="Falta"||r.nov==="Falta con aviso")c.falta++; if(r.nov==="Suspensión")c.susp++}
  return c}

/* ---------- historial, vacaciones, aguinaldo ---------- */
function asegurar(){DB.horarios=DB.horarios||{};DB.sanciones=DB.sanciones||[];DB.vacaciones=DB.vacaciones||{asign:[],tomadas:[]};DB.vacaciones.asign=DB.vacaciones.asign||[];DB.vacaciones.tomadas=DB.vacaciones.tomadas||[]}
const sancDe=emp=>(DB.sanciones||[]).filter(s=>s.emp===emp).sort((a,b)=>a.fecha<b.fecha?1:-1);
function semestre(f){const y=f.slice(0,4),m=+f.slice(5,7);return m<=6?{ini:y+"-01-01",fin:y+"-06-30",nom:"junio "+y,meses:[1,2,3,4,5,6].map(x=>y+"-"+String(x).padStart(2,"0"))}:{ini:y+"-07-01",fin:y+"-12-31",nom:"diciembre "+y,meses:[7,8,9,10,11,12].map(x=>y+"-"+String(x).padStart(2,"0"))}}
function totalMes(emp,ym){const ov=(DB.totMes||{})[emp+"|"+ym];if(ov!=null)return ov;
  const fin=finMes(ym);if(regimen(emp,fin)==="mensual"){const L=liqMes(emp,ym);return L.neto==null?null:L.sueldo}
  let s=0,hay=false;for(let f=ym+"-01";f<=fin;f=addD(f,1)){const r=dia(emp,f);if(r.h){hay=true;s+=hsPagas(emp,f,r.h)*tarifa(emp,f).hora}
    if(D(f).getDay()===1){const L=liqSemana(emp,f);if(L.hp>0)s+=L.tr}}
  return hay?s:null}
function sac(emp,f){const s=semestre(f),e=E(emp);
  const ms=s.meses.map(m=>({mes:m,tot:totalMes(emp,m)})).filter(x=>x.tot);if(!ms.length)return null;
  const mejor=ms.reduce((a,x)=>x.tot>a.tot?x:a);const ini=e.inicio||e.ingreso;const desde=ini&&ini>s.ini?ini:s.ini;
  const dias=(D(s.fin)-D(desde))/864e5+1,tot=(D(s.fin)-D(s.ini))/864e5+1,prop=Math.max(0,Math.min(1,dias/tot));
  return{sem:s,mejor:{mes:mejor.mes,bruto:mejor.tot},prop,monto:mejor.tot/2*prop}}
function vacDe(emp){const a=DB.vacaciones.asign.filter(x=>x.emp===emp),tk=DB.vacaciones.tomadas.filter(x=>x.emp===emp);
  const anios=[...new Set([...a.map(x=>x.anio),...tk.map(x=>x.anio)])].sort();
  return anios.map(y=>{const c=a.filter(x=>x.anio===y).reduce((s,x)=>s+x.dias,0),u=tk.filter(x=>x.anio===y);return{anio:y,corr:c,usados:u.reduce((s,x)=>s+x.dias,0),lista:u}})}
function importarHist(file){if(!file)return;file.text().then(txt=>{const H=JSON.parse(txt);asegurar();let n=0;
  for(const s of H.sanciones||[])if(!DB.sanciones.some(x=>x.emp===s.emp&&x.fecha===s.fecha&&x.tipo===s.tipo)){DB.sanciones.push({id:uid("s"),...s});n++}
  for(const a of (H.vacaciones||{}).asign||[])if(!DB.vacaciones.asign.some(x=>x.emp===a.emp&&x.anio===a.anio)){DB.vacaciones.asign.push(a);n++}
  for(const v of (H.vacaciones||{}).tomadas||[])if(!DB.vacaciones.tomadas.some(x=>x.emp===v.emp&&x.desde===v.desde&&x.dias===v.dias)){DB.vacaciones.tomadas.push({id:uid("v"),...v});n++}
  for(const r of H.recibos||[]){const ex=DB.recibos.find(x=>x.emp===r.emp&&x.mes===r.mes);if(ex){Object.assign(ex,r)}else DB.recibos.push(r);n++}
  for(const e of H.empleados||[]){const ex=E(e.id);if(ex){Object.assign(ex,e);n++}}
  if(H.totMes){DB.totMes=Object.assign(DB.totMes||{},H.totMes);n+=Object.keys(H.totMes).length}
  save("importación de históricos");render();toast(n+" datos históricos cargados")}).catch(e=>toast("No pude leer el archivo: "+e.message))}

/* ---------- navegación ---------- */
const TABS=[["inicio","🏠","Inicio"],["empleado","👤","Empleado"],["cargar","➕","Cargar"],["cc","💳","Cta. cte."],["fichaje","⏱️","Fichaje"],["cierre","📋","Cierre"],["datos","⚙️","Datos"]];
function renderNav(){$("#nav").innerHTML=TABS.map(([k,i,t])=>`<button class="${st.tab===k?"on":""}" onclick="go('${k}')"><span class="ic">${i}</span>${t}</button>`).join("")}
function go(t,emp){st.tab=t;if(emp){st.emp=emp;st.per=null}render();window.scrollTo(0,0)}
function render(){if(DB)asegurar();renderNav();setEstado(estado||"guardado ✓");
  ({inicio:vInicio,empleado:vEmp,cargar:vCargar,cc:vCC,fichaje:vFichaje,cierre:vCierre,datos:vDatos})[st.tab]()}

/* ---------- INICIO ---------- */
function vInicio(){
  const ym=HOY.slice(0,7);let tot=0,totAd=0;
  const cards=EMPS().map(id=>{
    const reg=regimen(id,HOY),cc=saldoCC(id),n=novMes(id,ym);
    let ad=0,ext="";
    if(reg==="mensual"){const l=liqMes(id,ym);ad=l.adel;ext=`<div class="row"><span>Adelantos de ${MESES[+ym.slice(5)-1]}</span><span class="num">${fmt(ad)}</span></div>`}
    else{const l=liqSemana(id,lunes(HOY));ext=`<div class="row"><span>Esta semana</span><span class="num">${fh(l.hp)} hs · ${fmt(l.bruto)}</span></div>`}
    tot+=cc;totAd+=ad;
    const tags=[`<span class="tag">${reg==="mensual"?"Cobra por mes":"Cobra por semana"}</span>`];
    const sc=sancDe(id).filter(s=>s.fecha>=addD(HOY,-365));if(sc.length)tags.push(`<span class="tag bad">${sc.length} sanción${sc.length>1?"es":""}</span>`);
    if(n.tarde)tags.push(`<span class="tag warn">${n.tarde} tarde</span>`);if(n.falta)tags.push(`<span class="tag bad">${n.falta} falta${n.falta>1?"s":""}</span>`);
    return `<div class="card emp" onclick="go('empleado','${id}')"><div class="row" style="border:0;padding-top:0"><span class="nm">${id}</span><span>${tags.join(" ")}</span></div>
      <div class="row"><span>Cuenta corriente</span><span class="num ${cc>0.5?"neg":""}"><b>${fmt(cc)}</b></span></div>${ext}
      <div class="row"><span class="muted">${E(id).situacion}</span><span class="muted">ver ›</span></div></div>`}).join("");

const R=(a,b,c="")=>`<div class="row ${c}"><span>${a}</span><span class="num">${b}</span></div>`;
function liqCard(id,L,isM,reg){
  let h=`<div class="card"><h2>Liquidación</h2>`;
  if(!isM){
    h+=R("Horas pagas",fh(L.hp)+" hs"+(L.hp!==L.ht?` <span class="muted">(${fh(L.ht)} trabajadas)</span>`:""));
    h+=R("Valor hora",L.valor===L.valor2?fmt(L.valor):fmt(L.valor)+" → "+fmt(L.valor2));
    h+=R("Sueldo por horas",fmt(L.imp));
    if(L.tr)h+=R("Traslado (+)",fmt(L.tr));
    h+=R("BRUTO",fmt(L.bruto),"tot");
    h+=R("Cuenta corriente descontada (−)",fmt(L.desc));
    h+=R("A PAGAR",fmt(L.pagar),"tot big");
  }else{
    const e=E(id);
    h+=R("Neto del recibo",L.neto==null?`<span class="tag warn">falta el recibo</span>`:fmt(L.neto));
    if(e.horasRecibo){h+=R("Horas del mes",fh(L.hp)+" hs"+(L.ov?' <span class="muted">(total cargado)</span>':""));
      h+=R("Cubre el recibo",fh(L.cub)+" hs");h+=R("Horas de más",fh(L.extra)+" hs × "+fmt(L.valor));h+=R("Horas de más (por fuera)",fmt(L.extraP))}
    if(L.plus)h+=R("Plus (por fuera)",fmt(L.plus));
    if(L.tras)h+=R("Traslado",fmt(L.tras));
    h+=R("SUELDO DEL MES",fmt(L.sueldo),"tot");
    L.ad.forEach(a=>h+=R(`Adelanto ${dm(a.fecha)} <span class="muted">${a.nota||a.forma}</span>`,"− "+fmt(a.importe)));
    h+=R("Cuenta corriente descontada (−)",fmt(L.desc));
    const falta=L.neto==null&&e.situacion.startsWith("Recibo");
    if(falta)h+=R("SALDO PROVISORIO <span class='muted'>(falta el recibo)</span>",fmt(L.saldo),"tot big");
    else h+=R(L.saldo<-0.5?"SALDO: TE DEBE":"SALDO A PAGAR",`<span class="${L.saldo<-0.5?"neg":""}">${fmt(Math.abs(L.saldo))}</span>`,"tot big");
    L.falta=falta;
  }
  h+=`<h3>Pagos</h3>`;
  const pg=L.pg.filter(p=>p.tipo==="pago");
  if(!pg.length)h+=`<div class="muted">Sin pagos cargados.</div>`;
  pg.forEach(p=>h+=R(`${dm(p.fecha)} · ${FORMA[p.forma]||p.forma}${p.cond?" · "+p.cond:""}`,fmt(p.importe)));
  const pend=isM?L.saldo-L.pagado:L.pend;
  if(!L.falta&&(pg.length||Math.abs(pend)>0.5))h+=R("Pendiente de pago",`<span class="${Math.abs(pend)>0.5?"neg":"pos"}">${Math.abs(pend)<0.5?"✓ pagado":fmt(pend)}</span>`,"tot");
  h+=`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" onclick="nuevoPago('${id}','${L.key}')">+ Pago</button><button class="btn sec sm" onclick="nuevoDesc('${id}','${L.key}')">+ Descuento cta. cte.</button>${isM?`<button class="btn sec sm" onclick="nuevoAdel('${id}','${L.key}')">+ Adelanto</button>`:`<button class="btn sec sm" onclick="imprimirRecibo('${id}','${L.key.slice(1)}')">🖨 Imprimir recibo</button>`}</div></div>`;
  return h}
const NOVS=["","Tarde","Falta","Falta con aviso","Suspensión","Otro"];

/* ---------- horario programado (lo que firma el empleado) ---------- */
const hDif=(a,b)=>{const f=s=>+s.slice(0,2)+(+s.slice(3))/60;return f(b)-f(a)};
function progDia(id,f){const v=(DB.horarios||{})[id+"|"+f];if(!v)return null;if(v==="franco")return{fr:true,h:0,txt:"Franco"};
  return{h:v.reduce((a,[l,i,s])=>a+hDif(i,s),0),txt:v.map(([l,i,s])=>`${l==="San Martín"?"SM":"Cárc"} ${i}–${s}`).join(" / ")}}
function horarioCard(id,lun,L){const e=E(id);let tp=0,tr=0,hay=false,rows="";
  for(let i=0;i<7;i++){const f=addD(lun,i),pd=progDia(id,f),fer=esFer(f);if(pd)hay=true;
    let hp=pd?pd.h:0;if(fer&&pd&&pd.fr)hp=id==="Gonzalo"?8:(e.horasRecibo?4:0);tp+=hp;
    const r=dia(id,f),hr=r.h!=null&&r.h!==""?+r.h:null;if(hr!=null)tr+=hr;
    const dif=hr!=null&&pd&&!pd.fr&&Math.abs(hr-pd.h)>=0.25?` <span class="tag warn">${hr>pd.h?"+":""}${fh(hr-pd.h)}</span>`:"";
    rows+=`<tr class="${fer?"fer":""}"><td>${DIAS[D(f).getDay()]} ${dm(f)}</td><td>${pd?pd.txt:'<span class="muted">—</span>'}${fer&&pd&&pd.fr?' <span class="tag">feriado pago</span>':""}</td><td class="num">${pd&&!pd.fr?fh(pd.h):""}</td><td class="num">${hr!=null?fh(hr):""}${dif}</td></tr>`}
  if(!hay)return`<div class="card"><h2>Horario programado</h2><div class="muted">Sin horario cargado para esta semana.</div></div>`;
  let h=`<div class="card"><h2>Horario programado</h2><div class="scroll"><table><tr><th>Día</th><th>Horario</th><th class="num">Prog.</th><th class="num">Trabajó</th></tr>${rows}`;
  h+=`<tr><td colspan="2"><b>Total</b></td><td class="num"><b>${fh(tp)}</b></td><td class="num"><b>${tr?fh(tr):""}</b></td></tr></table></div>`;
  if(e.hsSemana){const base=tr||tp,falta=e.hsSemana-base;
    h+=falta>0?`<div class="note" style="margin-top:10px">Debe ${fh(falta)} h para llegar a ${e.hsSemana} h semanales${tr?"":" (según horario)"}.</div>`:`<div class="muted" style="margin-top:8px">Cumple las ${e.hsSemana} h semanales.</div>`}
  return h+`</div>`}
function diasCard(id,L,isM){

  return `<div class="card"><h2>Horas y novedades</h2>${L.ov?'<div class="note">Este mes tiene cargado un total de horas sin detalle por día.</div>':""}${novTable(id,L,true)}</div>`}

function guardarPago(tipo){const m=vNum("#fm");if(!m)return toast("Falta el importe");

function guardarMov(c){const m=vNum("#fm");if(!m)return toast("Falta el importe");const emp=$("#fe").value;
  DB.movs.push({id:uid("m"),emp,fecha:$("#ff").value,tipo:c==="desc"?"descuento":"cargo",detalle:$("#fn").value||(c==="desc"?"Descuento en sueldo":"Cargo"),importe:m,imputa:c==="desc"?$("#fi").value:null});

function guardarNov(){const emp=$("#fe").value,f=$("#ff").value,key=emp+"|"+f,r=DB.horas[key]||{};
  r.nov=$("#ft").value;r.min=$("#fmin").value?+$("#fmin").value:null;r.obs=$("#fn").value;DB.horas[key]=r;save();toast("Novedad guardada");

function posNum(v){if(v==null||v==="")return 0;if(typeof v==="number")return v;let s=String(v).trim().replace(/\$/g,"").replace(/\s/g,"");
  if(s.includes(",")&&s.lastIndexOf(",")>s.lastIndexOf("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");return parseFloat(s)||0}
function posFecha(v){if(v instanceof Date)return iso(v);if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:null}
const posCol=(r,...ks)=>{for(const k of ks)if(r[k]!=null&&r[k]!=="")return r[k];return null};
let POSFILAS=[];
// Lee uno o varios reportes de ventas del sistema (uno por local). Toma solo ventas a cuenta corriente de empleados.
async function leerPOS(files){if(!files||!files.length)return;if(!window.XLSX)return toast("No cargó la librería de Excel");POSFILAS=[];const sin=new Set();
  for(const file of files){const buf=await file.arrayBuffer();const wb=XLSX.read(new Uint8Array(buf),{type:"array"});const ws=wb.Sheets["Ventas"]||wb.Sheets[wb.SheetNames[0]];
    const RR=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});const pvF=((RR.find(x=>x["Comprobante"])||{})["Comprobante"]||"").toString().slice(0,4);const locF=pvF==="0009"?"San Martín":pvF?"Cárcano":"";
    for(const r of RR){const cli=(r["Cliente"]||"").toString().trim();if(!cli)continue;
      const cc=posNum(posCol(r,"Cta Cte","Cta. Cte.","CTA CTE","Cta.Cte."));if(!(cc>0))continue;
      const emp=DB.empleados.find(x=>x.id.toLowerCase()===cli.toLowerCase()||(x.alias||[]).some(a=>cli.toLowerCase().includes(a.toLowerCase())));
      if(!emp){sin.add(cli);continue}
      const f=posFecha(r["Fecha"]);if(!f)continue;const comp=posCol(r,"Comprobante");const pv=comp?String(comp).slice(0,4):"";void locF;
      POSFILAS.push({emp:emp.id,fecha:f,importe:Math.round(cc*100)/100,detalle:"Compra"+((pv||pvF)==="0009"?" · San Martín":(pv||pvF)?" · Cárcano":"")+(comp?" · "+comp:""),archivo:file.name})}}
  POSFILAS.sort((a,b)=>a.emp<b.emp?-1:a.emp>b.emp?1:a.fecha<b.fecha?-1:1);
  const fs=POSFILAS.map(p=>p.fecha).sort();st.posSin=[...sin];
  if(!st.posD){const ult=DB.movs.filter(m=>m.tipo==="compra").map(m=>m.fecha).sort().pop();st.posD=ult||fs[0]}
  if(!st.posH)st.posH=fs[fs.length-1];posVista()}
// Marca cuáles ya están cargadas (mismo empleado, día e importe; cuenta las repetidas)
function posMarcar(){const usados={};const cnt={};DB.movs.forEach(m=>{if(m.tipo!=="compra")return;const k=m.emp+"|"+m.fecha+"|"+m.importe.toFixed(2);cnt[k]=(cnt[k]||0)+1});
  return POSFILAS.filter(p=>p.fecha>=st.posD&&p.fecha<=st.posH).map(p=>{const k=p.emp+"|"+p.fecha+"|"+p.importe.toFixed(2);usados[k]=(usados[k]||0)+1;return{...p,dup:usados[k]<=(cnt[k]||0)}})}
function posVista(){const out=$("#posOut");if(!out)return;if(!POSFILAS.length){out.innerHTML=`<div class="note">No encontré ventas a cuenta corriente de empleados en ese archivo.</div>`;return}
  st.posSel=st.posSel||{};POSFILAS.forEach(p=>{if(st.posSel[p.emp]==null)st.posSel[p.emp]=regimen(p.emp,HOY)!=="mensual"});
  const L=posMarcar(),todos=L.filter(p=>!p.dup),nuevos=todos.filter(p=>st.posSel[p.emp]),por={};todos.forEach(p=>{(por[p.emp]=por[p.emp]||[]).push(p)});
  out.innerHTML=`<div class="two" style="margin-top:10px"><div><label>Compras desde</label><input type="date" value="${st.posD}" onchange="st.posD=this.value;posVista()"></div><div><label>hasta</label><input type="date" value="${st.posH}" onchange="st.posH=this.value;posVista()"></div></div>
    <h3>${nuevos.length} compras nuevas para cargar</h3>
    <div class="muted">Destildá a quien no quieras cargar ahora (los que cobran por mes vienen destildados: se cargan a fin de mes).</div>
    ${Object.keys(por).map(k=>`<div style="margin-top:6px"><label style="display:inline-flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto" ${st.posSel[k]?"checked":""} onchange="st.posSel['${k}']=this.checked;posVista()"><b>${k}</b></label> · ${fmt2(por[k].reduce((a,p)=>a+p.importe,0))}
      <div class="muted" style="font-size:12px">${por[k].map(p=>`${dm(p.fecha)} ${fmt2(p.importe)}`).join(" · ")}</div></div>`).join("")}
    ${L.filter(p=>p.dup).length?`<div class="muted" style="margin-top:6px">${L.filter(p=>p.dup).length} ya estaban cargadas y se saltean.</div>`:""}
    ${(st.posSin||[]).length?`<div class="muted" style="margin-top:6px">No son empleados (no se cargan): ${st.posSin.join(", ")}.</div>`:""}
    ${nuevos.length?`<button class="btn full" style="margin-top:10px" onclick="confirmarPOS()">Cargar ${nuevos.length} compras</button>`:""}`}
function confirmarPOS(){const n=posMarcar().filter(p=>!p.dup&&st.posSel[p.emp]);n.forEach(p=>DB.movs.push({id:uid("m"),emp:p.emp,fecha:p.fecha,tipo:"compra",detalle:p.detalle,importe:p.importe,imputa:null}));
  save("cta. cte.: "+n.length+" compras del POS");toast(n.length+" compras cargadas");POSFILAS=[];st.posD=null;st.posH=null;st.posSel=null;st.tab="cc";render()}

function vCC(){const lun=lunes(HOY);let tot=0;st.ccAb=st.ccAb||{};

  EMPS().forEach(id=>{const M=movsDe(id).slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);const s=saldoCC(id);tot+=s;
    const ds=M.filter(m=>m.tipo==="descuento");const ud=ds[ds.length-1];
    const semC=M.filter(m=>m.tipo==="compra"&&m.fecha>=lun&&m.fecha<=addD(lun,6)).reduce((a,m)=>a+m.importe,0);
    const desde=ud?ud.fecha:null;const abierto=st.ccAb[id];
    h+=`<div class="card" style="padding:0;overflow:hidden;border-left:5px solid var(--pri)"><div onclick="st.ccAb['${id}']=!st.ccAb['${id}'];render()" style="cursor:pointer;padding:12px 14px;background:var(--pri-l)">
      <div class="row" style="border:0;padding:0"><b style="font-size:16px">${id}</b><b class="num ${s>0.5?"neg":""}">${s<-0.5?"A favor "+fmt2(-s):fmt2(s)}</b></div>
      <div class="muted" style="font-size:12px;margin-top:2px">Esta semana: ${fmt2(semC)} en compras · Último descuento: ${ud?`${fmt2(ud.importe)} el ${dm(ud.fecha)}`:"—"} · ${abierto?"▲ cerrar":"▼ ver detalle"}</div></div>`;
    if(abierto){let sa=0;st.ccDesde=st.ccDesde||addD(lun,-7);const desdeD=st.ccDesde;M.forEach(m=>{if(m.fecha<desdeD)sa+=DEBE(m)?m.importe:-m.importe});
      const det=M.filter(m=>m.fecha>=desdeD);let run=sa;
      h+=`<div class="scroll" style="padding:6px 10px 10px"><table><tr><th>Fecha</th><th>Detalle</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr>
        <tr><td colspan="4"><b>Saldo al ${dm(addD(desdeD,-1))}</b> <span class="muted" style="font-size:12px">· ver desde <input type="date" value="${desdeD}" onclick="event.stopPropagation()" onchange="st.ccDesde=this.value;render()" style="width:auto;display:inline-block;padding:2px 4px"></span></td><td class="num"><b>${fmt2(sa)}</b></td></tr>
        ${det.map(m=>{run+=DEBE(m)?m.importe:-m.importe;return`<tr><td>${dm(m.fecha)}</td><td>${m.tipo==="descuento"?"Descuento en sueldo"+(m.imputa?" ("+m.imputa.replace("S","semana del ").replace(/(\d{4})-(\d\d)-(\d\d)/,"$3/$2")+")":""):m.detalle||m.tipo}</td><td class="num">${DEBE(m)?fmt2(m.importe):""}</td><td class="num">${!DEBE(m)?fmt2(m.importe):""}</td><td class="num">${fmt2(run)}</td></tr>`}).join("")}
        <tr><td colspan="4"><b>Saldo hoy</b></td><td class="num ${s>0.5?"neg":""}"><b>${fmt2(s)}</b></td></tr></table></div>`}
    h+=`</div>`});
  h+=`<div class="card"><div class="row tot"><span>Total que deben</span><span class="num">${fmt2(tot)}</span></div></div>`;

const FORMA={efectivo:"efectivo",transferencia:"transferencia",deposito:"depósito Banco de Córdoba",incluido:"incluido en otro pago"};
function vCierre(){
  const ym=st.cierreMes,ini=ym+"-01",fin=finMes(ym);
  const pagos=DB.pagos.filter(p=>p.fecha>=ini&&p.fecha<=fin&&!p.sinCaja);
  const descs=DB.movs.filter(m=>m.tipo==="descuento"&&m.imputa&&m.fecha>=ini&&m.fecha<=fin);
  const imps=[...new Set([...pagos.filter(p=>p.tipo==="pago").map(p=>p.emp+"#"+p.imputa),...descs.map(m=>m.emp+"#"+m.imputa)])];
  const per={};const P=e=>per[e]||(per[e]={liqs:[],total:0,recibo:0,fuera:0,cc:0,adelPrev:0,formas:{},adelSig:[]});
  for(const k of imps){const[emp,imp]=k.split("#"),x=P(emp),sem=imp.startsWith("S");
    const L=sem?liqSemana(emp,imp.slice(1)):liqMes(emp,imp);
    const total=sem?L.bruto:L.sueldo,rec=sem?0:(L.neto||0);
    x.liqs.push({nom:sem?"semana "+dm(imp.slice(1))+" al "+dm(addD(imp.slice(1),6)):"sueldo de "+mesTxt(imp),total,rec});
    x.total+=total;x.recibo+=rec;x.fuera+=total-rec;x.cc+=L.desc;
    if(!sem)x.adelPrev+=L.ad.filter(a=>a.fecha<ini).reduce((s,a)=>s+a.importe,0)}
  for(const p of pagos){const x=P(p.emp);
    if(p.tipo==="adelanto"&&!imps.includes(p.emp+"#"+p.imputa))x.adelSig.push(p);
    else x.formas[p.forma]=(x.formas[p.forma]||0)+p.importe}
  const loc={sm:0,car:0,sas:0};let T={total:0,recibo:0,fuera:0,cc:0,caja:0,adel:0};
  let out=`PAGOS A EMPLEADOS - ${mesTxt(ym).toUpperCase()}\n`;
  for(const e of EMPS()){const x=per[e];if(!x)continue;const l=E(e).loc;
    loc.sm+=x.total*l.sm;loc.car+=x.total*l.car;loc.sas+=x.total*l.sas;
    const caja=Object.values(x.formas).reduce((a,b)=>a+b,0),ad=x.adelSig.reduce((a,p)=>a+p.importe,0);
    T.total+=x.total;T.recibo+=x.recibo;T.fuera+=x.fuera;T.cc+=x.cc;T.caja+=caja;T.adel+=ad;
    out+=`\n${e.toUpperCase()} - ${locTxt(e)}\n`;
    if(x.liqs.length){
      out+=`  Sueldo pagado: ${fmt(x.total)} (recibo ${fmt(x.recibo)} + por fuera ${fmt(x.fuera)})\n`;
      out+=`  Corresponde a: ${x.liqs.map(q=>q.nom).join(", ")}\n`;
      const fp=[...Object.entries(x.formas).filter(([k,v])=>v).map(([k,v])=>FORMA[k]+" "+fmt(v))];
      if(x.adelSig.length===0||fp.length)out+=`  Salió de caja/banco: ${fp.length?fp.join(" + "):"$ 0"}\n`;
      if(x.cc)out+=`  Descontado de cuenta corriente: ${fmt(x.cc)}\n`;
      if(x.adelPrev)out+=`  Adelantos pagados el mes anterior: ${fmt(x.adelPrev)}\n`}
    for(const p of x.adelSig)out+=`  Adelanto a cuenta de ${p.imputa.startsWith("S")?"la semana "+dm(p.imputa.slice(1)):mesTxt(p.imputa)}: ${fmt(p.importe)} - ${FORMA[p.forma]}${p.cond?" - "+p.cond:""} (${dm(p.fecha)})\n`}
  out+=`\nTOTALES DEL MES\n  Sueldos pagados: ${fmt(T.total)} (recibo ${fmt(T.recibo)} + por fuera ${fmt(T.fuera)})\n  Por local: San Martín ${fmt(loc.sm)} · Cárcano ${fmt(loc.car)} · Compartido SAS ${fmt(loc.sas)}\n  Salió de caja/banco: ${fmt(T.caja+T.adel)}${T.adel?` (incluye ${fmt(T.adel)} de adelantos a cuenta del mes siguiente)`:""}\n  Descontado de cuenta corriente: ${fmt(T.cc)}\n`;
  out+=`\nNota: el gasto en sueldos es el total pagado. La cuenta corriente es parte del sueldo pagada con mercadería (ya figura como venta en el POS): baja lo que sale de caja, pero no baja el gasto. Las cargas sociales y sindicales van aparte.`;
  $("#main").innerHTML=`<div class="per"><button class="btn sec sm" onclick="st.cierreMes=sumMes(st.cierreMes,-1);render()">◀</button><b>${mesTxt(ym)}</b><button class="btn sec sm" onclick="st.cierreMes=sumMes(st.cierreMes,1);render()">▶</button></div>
  <div class="card"><h2>Resumen para gastos de la empresa</h2>
  ${R("Sueldos pagados en el mes",fmt(T.total))}${R("· del recibo",fmt(T.recibo))}${R("· por fuera",fmt(T.fuera))}
  ${R("San Martín",fmt(loc.sm))}${R("Cárcano",fmt(loc.car))}${R("Compartido SAS",fmt(loc.sas))}
  ${R("Salió de caja / banco",fmt(T.caja+T.adel))}${R("Descontado de cuenta corriente",fmt(T.cc))}
  <h3>Listo para pegar en gastos</h3><pre class="out" id="cOut">${out}</pre>
  <div style="display:flex;gap:8px"><button class="btn" onclick="copiar()">Copiar</button><a class="btn sec" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(out)}" target="_blank">Mandar por WhatsApp</a></div></div>`}
function locTxt(emp){const l=E(emp).loc;if(l.sas>=1)return"Compartido SAS";if(l.sm>=1)return"San Martín";if(l.car>=1)return"Cárcano";return`San Martín ${Math.round(l.sm*100)}% / Cárcano ${Math.round(l.car*100)}%`}

<script type="module">
import { requireLogin } from "./login.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, Timestamp, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app = initializeApp({
  apiKey: "AIzaSyC5voDKO_imN8QqRRpjMQdwV7QILrJw40g",
  authDomain: "frioteka-preventista.firebaseapp.com",
  projectId: "frioteka-preventista",
  storageBucket: "frioteka-preventista.firebasestorage.app",
  messagingSenderId: "212598423220",
  appId: "1:212598423220:web:aee51bc39626b3c08621e1"
}, "empleados");
await requireLogin(app, { color: "#C04F77", titulo: "Empleados FRIOTEKA" });
const fs = getFirestore(app);
// Colecciones del fichaje (no tocan las de las otras apps)
const C = { marcas: "fj_marcas", pines: "fj_pines", horarios: "fj_horarios", config: "fj_config", borrados: "fj_borrados" };
const CLAVE = "_borrado"; // fj_pines/_borrado guarda el hash del código de borrado (solo lo lee el admin)
const t0 = f => Timestamp.fromDate(new Date(f + "T00:00:00-03:00")), t1 = f => Timestamp.fromDate(new Date(f + "T23:59:59-03:00"));
window.FJ = {
  async marcas(desde, hasta) {
    const s = await getDocs(query(collection(fs, C.marcas), where("ts", ">=", t0(desde)), where("ts", "<=", t1(hasta))));
    return s.docs.map(d => { const x = d.data(); return { id: d.id, ...x, t: x.ts ? x.ts.toDate() : null }; });
  },
  async config() { return (await getDoc(doc(fs, C.config, "general"))).data() || {}; },
  async setConfig(o) { await setDoc(doc(fs, C.config, "general"), o, { merge: true }); },
  async setPin(usuario, hash) { await setDoc(doc(fs, C.pines, usuario), { hash, actualizado: new Date().toISOString() }); },
  async pines() { const s = await getDocs(collection(fs, C.pines)); return Object.fromEntries(s.docs.map(d => [d.id, true])); },
  async syncHorarios(lun, turnos) { const t = {}; for (const k in turnos) { const v = turnos[k]; t[k] = Array.isArray(v) ? v.map(([l, i, s]) => ({ l, i, s })) : v; } /* Firestore no acepta listas dentro de listas */ await setDoc(doc(fs, C.horarios, lun), { turnos: t, actualizado: new Date().toISOString() }); },
  // Código de borrado
  async clave() { return ((await getDoc(doc(fs, C.pines, CLAVE))).data() || {}).hash || null; },
  async setClave(hash) { await setDoc(doc(fs, C.pines, CLAVE), { hash, actualizado: new Date().toISOString() }); },
  // Borra una marca dejando una copia en fj_borrados (las reglas exigen las dos cosas juntas y el código correcto)
  async borrar(id, motivo, clave) {
    const ref = doc(fs, C.marcas, id), snap = await getDoc(ref);
    if (!snap.exists()) throw new Error("La marca ya no existe");
    const b = writeBatch(fs);
    b.set(doc(fs, C.borrados, id), { ...snap.data(), motivo: motivo || "", clave, borradoPor: (getAuth(app).currentUser || {}).email || "", borradoEl: serverTimestamp() });
    b.delete(ref);
    await b.commit();
  },
  async borrados(desde, hasta) {
    const s = await getDocs(query(collection(fs, C.borrados), where("ts", ">=", t0(desde)), where("ts", "<=", t1(hasta))));
    return s.docs.map(d => { const x = d.data(); return { id: d.id, ...x, t: x.ts ? x.ts.toDate() : null, tb: x.borradoEl ? x.borradoEl.toDate() : null }; });
  }
};
window.dispatchEvent(new Event("fj-listo"));
</script>
